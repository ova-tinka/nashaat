name: Bloom CI

on:
  push:
    branches: [main, audit]
  pull_request:
    branches: [main]

jobs:
  unit-lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev
      - run: npm run build:epub-bundle
      - run: git diff --exit-code -- src/assets/epubjs.min.bundle src/assets/epubjs.bundle.meta.json
      - run: npm run build:web
      - run: node scripts/check-web-payload.mjs

  deno-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.x'
      - run: deno test --cached-only --allow-env supabase/functions/_shared/*_test.ts
      - run: deno audit --lock=deno.lock --level=moderate

  database-bootstrap-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:bootstrap
      - run: npm run test:schema

  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:macos-native

  qa-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/validate-qa-docs.py
